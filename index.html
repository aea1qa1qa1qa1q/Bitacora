<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora del día</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#11141c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #11141c;
    --bg-elev: #171b26;
    --bg-card: #1c2030;
    --bg-card-done: #171a22;
    --border: #2a2f40;
    --border-done: #24291f;
    --text: #e7e6e0;
    --text-dim: #8a8fa3;
    --text-faint: #5a5f72;
    --gold: #e0b04e;
    --gold-dim: #7a6438;
    --teal: #4fb8a8;
    --danger: #d9705a;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f3f1ea;
    --bg-elev: #ebe8de;
    --bg-card: #ffffff;
    --bg-card-done: #eeece4;
    --border: #dcd8ca;
    --border-done: #e0dcc8;
    --text: #211f1a;
    --text-dim: #6b6659;
    --text-faint: #9b9584;
    --gold: #a3781f;
    --gold-dim: #cbb27a;
    --teal: #1f8a78;
    --danger: #b8503b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1ea;
      --bg-elev: #ebe8de;
      --bg-card: #ffffff;
      --bg-card-done: #eeece4;
      --border: #dcd8ca;
      --border-done: #e0dcc8;
      --text: #211f1a;
      --text-dim: #6b6659;
      --text-faint: #9b9584;
      --gold: #a3781f;
      --gold-dim: #cbb27a;
      --teal: #1f8a78;
      --danger: #b8503b;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 6px;
  }
  .title { display: flex; flex-direction: column; }
  .kicker {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .streak {
    text-align: right;
    font-family: var(--font-mono);
  }
  .streak .n {
    font-size: 22px;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }
  .streak .l {
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 26px;
  }
  .bar {
    flex: 1;
    height: 6px;
    background: var(--bg-elev);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .block {
    margin-bottom: 22px;
  }
  .block-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 2px 10px;
  }
  .block-head .glyph {
    font-size: 15px;
  }
  .block-head h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin: 0;
  }
  .block-head .span {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    user-select: none;
  }
  .card:active { transform: scale(0.995); }
  .card.done {
    background: var(--bg-card-done);
    border-color: var(--border-done);
  }
  .box {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--text-faint);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .card.done .box {
    background: var(--teal);
    border-color: var(--teal);
  }
  .box svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s ease; }
  .card.done .box svg { opacity: 1; }

  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.3;
  }
  .card.done .card-title {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
  }
  .card-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .locked {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-elev);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 13px 14px;
  }
  .locked .card-title { color: var(--gold); font-weight: 500; }
  .locked .card-time { color: var(--gold-dim); }
  .locked .box {
    border-color: var(--gold-dim);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  /* protected-type activity: same locked look, but lives in the normal card flow so it's editable */
  .card.type-protegida {
    background: var(--bg-elev);
    border-style: dashed;
    cursor: default;
  }
  .card.type-protegida .card-title { color: var(--gold); font-weight: 500; }
  .card.type-protegida .card-time { color: var(--gold-dim); }
  .card.type-protegida .box {
    border-color: var(--gold-dim);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .card.type-protegida .box svg { display: none; }
  .card.type-protegida:not(.editmode) .box::after { content: "∞"; }

  /* one-off / unforeseen activity */
  .card.type-imprevisto {
    border-style: dashed;
    border-color: var(--danger);
  }
  .card.type-imprevisto .card-title::before {
    content: "✦ ";
    color: var(--danger);
  }

  .type-select {
    display: flex;
    gap: 6px;
  }
  .type-btn {
    flex: 1;
    padding: 9px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
  }
  .type-btn.active {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: rgba(224,176,78,0.08);
  }

  footer {
    margin-top: 28px;
    text-align: center;
  }
  .reset-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 16px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .reset-btn:hover { color: var(--danger); border-color: var(--danger); }
  .date-note {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 10px;
  }

  .theme-toggle {
    position: fixed;
    top: 14px; right: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    width: 32px; height: 32px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .edit-toggle {
    position: fixed;
    top: 14px; right: 54px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    width: 32px; height: 32px;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .edit-toggle.active {
    color: var(--gold);
    border-color: var(--gold-dim);
  }

  .card.editing { cursor: default; }
  .card-actions {
    display: none;
    gap: 6px;
    flex-shrink: 0;
  }
  .card.editmode .card-actions { display: flex; }
  .card.editmode .box { opacity: 0.4; pointer-events: none; }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text-dim);
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  .add-row {
    display: none;
  }
  .add-row.show { display: block; }
  .add-btn {
    width: 100%;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    margin-top: 2px;
  }
  .add-btn:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 560px;
    padding: 20px 18px 24px;
  }
  .modal h3 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--text);
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    margin-bottom: 5px;
    letter-spacing: 0.03em;
  }
  .field input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 11px;
    color: var(--text);
    font-family: var(--font-display);
    font-size: 14px;
  }
  .field input:focus { outline: none; border-color: var(--gold-dim); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .btn-cancel { background: none; color: var(--text-dim); }
  .btn-save { background: var(--teal); color: #0c1613; border-color: var(--teal); }
  .btn-delete-full {
    background: none; color: var(--danger); border-color: var(--danger);
  }

  /* history strip */
  .history {
    margin: 26px 0 10px;
  }
  .history-head {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .history-row {
    display: flex;
    gap: 6px;
  }
  .history-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-faint);
  }
  .history-cell.complete { background: var(--teal); border-color: var(--teal); color: #0c1613; }
  .history-cell.partial { background: var(--gold-dim); border-color: var(--gold-dim); color: #23190a; }
  .history-cell.today { border-color: var(--gold); border-width: 1.5px; }

  .history-head-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .cal-toggle {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    background: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .cal-toggle.active { color: var(--gold); border-color: var(--gold-dim); }

  .calendar { display: none; margin-top: 14px; }
  .calendar.show { display: block; }
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .cal-nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    width: 26px; height: 26px;
    cursor: pointer;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-dow {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-faint);
    padding-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
  }
  .cal-cell.empty { background: none; border: none; }
  .cal-cell.complete { background: var(--teal); border-color: var(--teal); color: #0c1613; }
  .cal-cell.partial { background: var(--gold-dim); border-color: var(--gold-dim); color: #23190a; }
  .cal-cell.today { border-color: var(--gold); border-width: 1.5px; }
</style>
</head>
<body>
<button class="edit-toggle" id="editToggle" aria-label="Editar">✎</button>
<button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">◐</button>
<div class="wrap">
  <header>
    <div class="title">
      <div class="kicker">BITÁCORA · HOY</div>
      <h1 id="dayName">Cargando…</h1>
    </div>
    <div class="streak">
      <div class="n" id="streakN">0</div>
      <div class="l">DÍAS SEGUIDOS</div>
    </div>
  </header>

  <div class="progress-row">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="progress-label" id="progressLabel">0/0</div>
  </div>

  <div id="blocks"></div>

  <div class="history">
    <div class="history-head-row">
      <div class="history-head">ÚLTIMOS 7 DÍAS</div>
      <button class="cal-toggle" id="calToggle">ver mes ▾</button>
    </div>
    <div class="history-row" id="historyRow"></div>
    <div class="calendar" id="calendar">
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <span id="calLabel">—</span>
        <button id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <footer>
    <button class="reset-btn" id="resetBtn">reiniciar hoy</button>
    <button class="reset-btn" id="exportBtn" style="margin-left:8px;">exportar historial (.csv)</button>
    <div class="date-note" id="dateNote"></div>
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Editar actividad</h3>
    <div class="field">
      <label>Tipo</label>
      <div class="type-select" id="typeSelect">
        <button type="button" class="type-btn" data-type="normal">Normal</button>
        <button type="button" class="type-btn" data-type="protegida">Protegida</button>
        <button type="button" class="type-btn" data-type="imprevisto">Imprevisto</button>
      </div>
    </div>
    <div class="field">
      <label>Actividad</label>
      <input type="text" id="fieldTitle" placeholder="Ej. Estirar 10 min">
    </div>
    <div class="field">
      <label>Hora (opcional)</label>
      <input type="time" id="fieldTime">
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <input type="text" id="fieldNote" placeholder="Ej. hasta las 7:30, antes de esta hora...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancelar</button>
      <button class="btn-save" id="modalSave">Guardar</button>
    </div>
    <div class="modal-actions" id="modalDeleteRow" style="display:none;">
      <button class="btn-delete-full" id="modalDelete">Eliminar actividad</button>
    </div>
  </div>
</div>

<script>
(function () {
  const DEFAULT_QUESTS = [
    { block: "MAÑANA", glyph: "☀", items: [
      { id: "wake", t: "Despertar", time: "06:00", note: "", type: "normal" },
      { id: "water", t: "Agua + unos minutos de luz/aire libre", time: "06:05", note: "", type: "normal" },
      { id: "pre", t: "Snack pre-gym (plátano o pan con miel)", time: "06:15", note: "", type: "normal" },
      { id: "gym", t: "Entrenar pesado", time: "06:30", note: "hasta las 7:30 am", type: "normal" },
      { id: "post", t: "Comida fuerte post-gym", time: "07:45", note: "", type: "normal" },
    ]},
    { block: "DÍA", glyph: "◆", items: [
      { id: "moves", t: "Pausas activas cada 1–2 horas", time: "", note: "", type: "normal" },
      { id: "lunch", t: "Comida del mediodía (proteína + verdura)", time: "", note: "", type: "normal" },
      { id: "walk", t: "Caminata", time: "", note: "", type: "normal" },
    ]},
    { block: "TARDE", glyph: "◐", items: [
      { id: "dinner", t: "Cena ligera", time: "17:30", note: "antes de las 6:00 pm", type: "normal" },
      { id: "zone", t: "Videojuegos / llamada con amigos", time: "18:00", note: "hasta 11–12 pm", type: "protegida" },
    ]},
    { block: "NOCHE", glyph: "☾", items: [
      { id: "sleep", t: "Dormir", time: "", note: "", type: "normal" },
    ]},
  ];

  function makeId() { return "q" + Date.now() + Math.floor(Math.random() * 1000); }

  const todayKey = () => new Date().toISOString().slice(0, 10);
  const QUESTS_KEY = "quest-log-quests";
  const STORE_KEY = "quest-log-state";
  const STREAK_KEY = "quest-log-streak";
  const THEME_KEY = "quest-log-theme";
  const HISTORY_KEY = "quest-log-history"; // array of {date, done, total}

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  function legacyParseToMinutes(str) {
    if (!str) return null;
    const m = str.match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
    if (!m) return null;
    let h = parseInt(m[1], 10);
    const min = parseInt(m[2], 10);
    const ap = (m[3] || "").toLowerCase();
    if (ap === "pm" && h !== 12) h += 12;
    if (ap === "am" && h === 12) h = 0;
    return h * 60 + min;
  }
  function minutesTo24(mins) {
    const h = Math.floor(mins / 60), m = mins % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }
  function migrateItem(item) {
    if (!item.type) item.type = "normal";
    if (item.note === undefined) item.note = "";
    // already migrated (24h HH:MM or empty)
    if (item.time === "" || /^\d{2}:\d{2}$/.test(item.time)) return item;
    // old free-text time like "6:15 am" or "antes de 6:00 pm"
    const mins = legacyParseToMinutes(item.time);
    const original = item.time;
    item.time = mins !== null ? minutesTo24(mins) : "";
    if (!item.note) item.note = original;
    return item;
  }
  function migrateQuests(q) {
    q.forEach(block => { block.items = block.items.map(migrateItem); });
    return q;
  }

  function loadQuests() {
    const raw = safeGet(QUESTS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_QUESTS));
    try { return migrateQuests(JSON.parse(raw)); } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_QUESTS)); }
  }
  function saveQuests(q) { safeSet(QUESTS_KEY, JSON.stringify(q)); }

  function loadHistory() {
    const raw = safeGet(HISTORY_KEY);
    if (!raw) return [];
    try { return JSON.parse(raw); } catch (e) { return []; }
  }
  function saveHistory(h) { safeSet(HISTORY_KEY, JSON.stringify(h.slice(-120))); }

  function archiveIfNewDay(prevState, total) {
    if (!prevState || prevState.date === todayKey()) return;
    const doneCount = Object.values(prevState.done || {}).filter(Boolean).length;
    if (doneCount === 0) return; // nothing to log for an untouched day
    const history = loadHistory();
    const existing = history.findIndex(h => h.date === prevState.date);
    const entry = { date: prevState.date, done: doneCount, total };
    if (existing >= 0) history[existing] = entry; else history.push(entry);
    saveHistory(history);
  }

  function loadState(total) {
    const raw = safeGet(STORE_KEY);
    if (!raw) return { date: todayKey(), done: {} };
    try {
      const parsed = JSON.parse(raw);
      if (parsed.date !== todayKey()) {
        archiveIfNewDay(parsed, total);
        return { date: todayKey(), done: {} };
      }
      return parsed;
    } catch (e) {
      return { date: todayKey(), done: {} };
    }
  }
  function saveState(s) { safeSet(STORE_KEY, JSON.stringify(s)); }

  function updateStreak(allDoneNow) {
    let streak = 0;
    try { streak = parseInt(safeGet(STREAK_KEY) || "0", 10) || 0; } catch (e) {}
    let lastCompleteDate = safeGet(STREAK_KEY + "-date") || "";
    if (allDoneNow && lastCompleteDate !== todayKey()) {
      streak += 1;
      safeSet(STREAK_KEY, String(streak));
      safeSet(STREAK_KEY + "-date", todayKey());
    }
    return streak;
  }

  let quests = loadQuests();
  let totalCount = quests.reduce((n, b) => n + b.items.filter(i => i.type !== "protegida").length, 0);
  let state = loadState(totalCount);
  let editMode = false;

  const dayNames = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  document.getElementById("dayName").textContent = dayNames[new Date().getDay()];
  document.getElementById("dateNote").textContent = "se reinicia automáticamente cada día";

  const blocksEl = document.getElementById("blocks");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const fieldTitle = document.getElementById("fieldTitle");
  const fieldTime = document.getElementById("fieldTime");
  const modalTitle = document.getElementById("modalTitle");
  const modalDeleteRow = document.getElementById("modalDeleteRow");

  let modalCtx = null; // { blockIdx, itemIdx } or { blockIdx, isNew: true }

  function checkIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }

  function parseTimeToMinutes(str) {
    if (!str) return null;
    const m = str.match(/^(\d{2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function formatTimeDisplay(hhmm) {
    if (!hhmm) return "";
    const [hStr, mStr] = hhmm.split(":");
    let h = parseInt(hStr, 10);
    const ap = h >= 12 ? "pm" : "am";
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${mStr} ${ap}`;
  }

  function sortBlockByTime(block) {
    block.items.sort((a, b) => {
      const ta = parseTimeToMinutes(a.time);
      const tb = parseTimeToMinutes(b.time);
      if (ta === null && tb === null) return 0;
      if (ta === null) return 1;
      if (tb === null) return -1;
      return ta - tb;
    });
  }

  const fieldNote = document.getElementById("fieldNote");
  const typeSelect = document.getElementById("typeSelect");
  let selectedType = "normal";

  typeSelect.querySelectorAll(".type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedType = btn.dataset.type;
      typeSelect.querySelectorAll(".type-btn").forEach(b => b.classList.toggle("active", b === btn));
    });
  });

  function openModal(ctx) {
    modalCtx = ctx;
    if (ctx.isNew) {
      modalTitle.textContent = "Nueva actividad";
      fieldTitle.value = "";
      fieldTime.value = "";
      fieldNote.value = "";
      selectedType = "normal";
      modalDeleteRow.style.display = "none";
    } else {
      const item = quests[ctx.blockIdx].items[ctx.itemIdx];
      modalTitle.textContent = "Editar actividad";
      fieldTitle.value = item.t;
      fieldTime.value = item.time || "";
      fieldNote.value = item.note || "";
      selectedType = item.type || "normal";
      modalDeleteRow.style.display = "flex";
    }
    typeSelect.querySelectorAll(".type-btn").forEach(b => b.classList.toggle("active", b.dataset.type === selectedType));
    modalBackdrop.classList.add("show");
    setTimeout(() => fieldTitle.focus(), 50);
  }
  function closeModal() {
    modalBackdrop.classList.remove("show");
    modalCtx = null;
  }
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

  document.getElementById("modalSave").addEventListener("click", () => {
    const title = fieldTitle.value.trim();
    if (!title) { fieldTitle.focus(); return; }
    const time = fieldTime.value; // already HH:MM (24h) from the native picker, or ""
    const note = fieldNote.value.trim();
    if (modalCtx.isNew) {
      const id = makeId();
      quests[modalCtx.blockIdx].items.push({ id, t: title, time, note, type: selectedType });
    } else {
      const item = quests[modalCtx.blockIdx].items[modalCtx.itemIdx];
      item.t = title;
      item.time = time;
      item.note = note;
      item.type = selectedType;
    }
    sortBlockByTime(quests[modalCtx.blockIdx]);
    saveQuests(quests);
    totalCount = quests.reduce((n, b) => n + b.items.filter(i => i.type !== "protegida").length, 0);
    closeModal();
    render();
  });

  document.getElementById("modalDelete").addEventListener("click", () => {
    const item = quests[modalCtx.blockIdx].items[modalCtx.itemIdx];
    quests[modalCtx.blockIdx].items.splice(modalCtx.itemIdx, 1);
    delete state.done[item.id];
    saveQuests(quests);
    saveState(state);
    totalCount = quests.reduce((n, b) => n + b.items.filter(i => i.type !== "protegida").length, 0);
    closeModal();
    render();
  });

  function render() {
    blocksEl.innerHTML = "";
    let total = 0, done = 0;

    quests.forEach((block, bIdx) => {
      const blockEl = document.createElement("div");
      blockEl.className = "block";

      const head = document.createElement("div");
      head.className = "block-head";
      head.innerHTML = `<span class="glyph">${block.glyph}</span><h2>${block.block}</h2>`;
      blockEl.appendChild(head);

      block.items.forEach((item, iIdx) => {
        const isProtected = item.type === "protegida";
        if (!isProtected) total++;
        const isDone = !!state.done[item.id];
        if (!isProtected && isDone) done++;

        const timeLabel = formatTimeDisplay(item.time);
        const timeLine = [timeLabel, item.note].filter(Boolean).join(" · ");

        const card = document.createElement("div");
        card.className = "card"
          + (isDone && !isProtected ? " done" : "")
          + (editMode ? " editmode" : "")
          + (item.type === "protegida" ? " type-protegida" : "")
          + (item.type === "imprevisto" ? " type-imprevisto" : "");
        card.innerHTML = `
          <div class="box">${isProtected ? "" : checkIcon()}</div>
          <div class="card-body">
            <div class="card-title">${item.t}</div>
            ${timeLine ? `<div class="card-time">${timeLine}</div>` : ""}
          </div>
          <div class="card-actions">
            <button class="icon-btn edit-item" aria-label="Editar">✎</button>
          </div>
        `;
        card.addEventListener("click", (e) => {
          if (editMode) {
            if (e.target.closest(".edit-item")) openModal({ blockIdx: bIdx, itemIdx: iIdx });
            return;
          }
          if (isProtected) return; // not toggleable
          state.done[item.id] = !state.done[item.id];
          state.date = todayKey();
          saveState(state);
          render();
        });
        blockEl.appendChild(card);
      });

      const addRow = document.createElement("div");
      addRow.className = "add-row" + (editMode ? " show" : "");
      addRow.innerHTML = `<button class="add-btn">+ agregar actividad</button>`;
      addRow.querySelector("button").addEventListener("click", () => openModal({ blockIdx: bIdx, isNew: true }));
      blockEl.appendChild(addRow);

      blocksEl.appendChild(blockEl);
    });

    document.getElementById("progressLabel").textContent = `${done}/${total}`;
    document.getElementById("barFill").style.width = total ? `${(done / total) * 100}%` : "0%";

    const allDone = total > 0 && done === total;
    const streak = updateStreak(allDone);
    document.getElementById("streakN").textContent = streak;

    renderHistory(done, total);
    renderCalendar(done, total);
  }

  function renderHistory(todayDone, todayTotal) {
    const history = loadHistory();
    const row = document.getElementById("historyRow");
    row.innerHTML = "";
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      days.push(key);
    }
    const dayLetters = ["D","L","M","M","J","V","S"];
    days.forEach(key => {
      const isToday = key === todayKey();
      const entry = isToday ? { done: todayDone, total: todayTotal } : history.find(h => h.date === key);
      const cell = document.createElement("div");
      let cls = "history-cell";
      if (isToday) cls += " today";
      if (entry && entry.total > 0) {
        if (entry.done === entry.total) cls += " complete";
        else if (entry.done > 0) cls += " partial";
      }
      cell.className = cls;
      const d = new Date(key + "T00:00:00");
      cell.textContent = dayLetters[d.getDay()];
      cell.title = entry ? `${key}: ${entry.done}/${entry.total}` : key;
      row.appendChild(cell);
    });
  }

  let calOpen = false;
  let calCursor = new Date(); // month currently shown

  function renderCalendar(todayDone, todayTotal) {
    if (!calOpen) return;
    const history = loadHistory();
    const map = {};
    history.forEach(h => { map[h.date] = h; });
    map[todayKey()] = { done: todayDone, total: todayTotal };

    const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    document.getElementById("calLabel").textContent = `${monthNames[calCursor.getMonth()]} ${calCursor.getFullYear()}`;

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    ["D","L","M","M","J","V","S"].forEach(l => {
      const dow = document.createElement("div");
      dow.className = "cal-dow";
      dow.textContent = l;
      grid.appendChild(dow);
    });

    const year = calCursor.getFullYear(), month = calCursor.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement("div");
      empty.className = "cal-cell empty";
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(year, month, d);
      const key = dateObj.toISOString().slice(0, 10);
      const entry = map[key];
      const cell = document.createElement("div");
      let cls = "cal-cell";
      if (key === todayKey()) cls += " today";
      if (entry && entry.total > 0) {
        if (entry.done === entry.total) cls += " complete";
        else if (entry.done > 0) cls += " partial";
      }
      cell.className = cls;
      cell.textContent = d;
      cell.title = entry ? `${key}: ${entry.done}/${entry.total}` : key;
      grid.appendChild(cell);
    }
  }

  document.getElementById("calToggle").addEventListener("click", (e) => {
    calOpen = !calOpen;
    e.currentTarget.classList.toggle("active", calOpen);
    document.getElementById("calendar").classList.toggle("show", calOpen);
    if (calOpen) {
      const doneNow = Object.values(state.done).filter(Boolean).length;
      renderCalendar(doneNow, totalCount);
    }
  });
  document.getElementById("calPrev").addEventListener("click", () => {
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1);
    const doneNow = Object.values(state.done).filter(Boolean).length;
    renderCalendar(doneNow, totalCount);
  });
  document.getElementById("calNext").addEventListener("click", () => {
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1);
    const doneNow = Object.values(state.done).filter(Boolean).length;
    renderCalendar(doneNow, totalCount);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    state = { date: todayKey(), done: {} };
    saveState(state);
    render();
  });

  document.getElementById("editToggle").addEventListener("click", (e) => {
    editMode = !editMode;
    e.currentTarget.classList.toggle("active", editMode);
    render();
  });

  // theme toggle (cycles: system -> dark -> light -> system)
  const root = document.documentElement;
  let theme = safeGet(THEME_KEY) || "system";
  function applyTheme() {
    if (theme === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", theme);
  }
  applyTheme();
  document.getElementById("themeToggle").addEventListener("click", () => {
    theme = theme === "system" ? "dark" : theme === "dark" ? "light" : "system";
    safeSet(THEME_KEY, theme);
    applyTheme();
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const history = loadHistory();
    const todayEntry = { date: todayKey(), done: Object.values(state.done).filter(Boolean).length, total: totalCount };
    const map = {};
    history.forEach(h => { map[h.date] = h; });
    map[todayEntry.date] = todayEntry;
    const rows = Object.values(map).sort((a, b) => a.date.localeCompare(b.date));

    const dayNamesFull = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    let csv = "fecha,dia,completadas,total,porcentaje\n";
    rows.forEach(r => {
      const d = new Date(r.date + "T00:00:00");
      const pct = r.total ? Math.round((r.done / r.total) * 100) : 0;
      csv += `${r.date},${dayNamesFull[d.getDay()]},${r.done},${r.total},${pct}%\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bitacora-historial-${todayKey()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  render();
})();
</script>
</body>
</html>
